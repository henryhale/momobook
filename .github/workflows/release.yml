name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/momobook-release.jks
          {
            echo "storeFile=keystore/momobook-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build debug + release APKs and release bundle, run tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease testDebugUnitTest \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ github.run_number }}"

      - name: Collect APKs and bundle
        run: |
          V="${{ steps.version.outputs.name }}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MoMoBook-$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/MoMoBook-$V-debug.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/MoMoBook-$V.aab"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.apk
            out/*.aab
          generate_release_notes: true

      - name: Remove signing key
        if: always()
        run: rm -f keystore/momobook-release.jks keystore.properties
